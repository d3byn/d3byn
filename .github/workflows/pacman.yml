name: Update profile images

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate Pac-Man contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          player_style: 'opportunistic'

      - name: Inline external images into SVG (fixes broken ghost icons)
        run: |
          python3 - <<'EOF'
          import re, base64, glob, urllib.request

          for path in glob.glob("dist/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  svg = f.read()

              def inline_image(match):
                  attr, url = match.group(1), match.group(2)
                  if url.startswith("data:"):
                      return match.group(0)
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      data = urllib.request.urlopen(req, timeout=15).read()
                      mime = "image/png"
                      low = url.lower()
                      if low.endswith(".gif"):
                          mime = "image/gif"
                      elif low.endswith((".jpg", ".jpeg")):
                          mime = "image/jpeg"
                      elif low.endswith(".svg"):
                          mime = "image/svg+xml"
                      b64 = base64.b64encode(data).decode()
                      return f'{attr}="data:{mime};base64,{b64}"'
                  except Exception as e:
                      print(f"WARN: could not inline {url}: {e}")
                      return match.group(0)

              svg = re.sub(r'(xlink:href|href)="(https?://[^"]+)"', inline_image, svg)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(svg)
              print(f"Processed {path} ({len(svg)} bytes)")
          EOF

      # Render only. commit must stay false: the action's default pushes an
      # orphan branch named output, which is what makes GitHub show
      # "output had recent pushes / Compare & pull request".
      - name: Generate Tulkun
        uses: PramudithaN/git-tulkun@v1
        with:
          view: side
          window: annual
          commit: "false"
          output-dir: tulkun

      - name: Publish images as a tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist/tulkun
          cp tulkun/tulkun.gif tulkun/tulkun.png tulkun/share-card.png dist/tulkun/

          # GitHub only shows the ahead/behind banner for branches.
          # A tag named output keeps the existing raw image URLs working.
          work="$(mktemp -d)"
          cp -a dist/. "$work/"
          cd "$work"
          git init -q
          git checkout -q --orphan publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update profile images"
          git tag -f output
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git push -f origin refs/tags/output
          if git ls-remote --heads origin output | grep -q output; then
            git push origin :refs/heads/output
          fi
